name: Update Gist

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */4 * * *"

jobs:
  update-gist:
    runs-on: ubuntu-latest

    steps:
      - name: Get content from Worker
        run: |
          curl -fsSL \
            "https://orange-mountain-1d16.hninisiimoo.workers.dev/" \
            -o servers.txt

      - name: Update servers.txt in Gist
        env:
          GH_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          gist_id = "4150f35af6dbfb31985573a26d7c9c8e"
          token = os.environ["GH_TOKEN"]

          with open("servers.txt", "r", encoding="utf-8") as f:
              content = f.read()

          data = {
              "files": {
                  "servers.txt": {
                      "content": content
                  }
              }
          }

          request = urllib.request.Request(
              f"https://api.github.com/gists/{gist_id}",
              data=json.dumps(data).encode("utf-8"),
              method="PATCH",
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
              },
          )

          with urllib.request.urlopen(request) as response:
              print("servers.txt updated successfully!")
              print("HTTP status:", response.status)
          PY
