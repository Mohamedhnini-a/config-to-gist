name: Update Gist

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

jobs:
  update-gist:
    runs-on: ubuntu-latest

    steps:
      - name: Download working configs
        run: |
          curl -L \
            "https://raw.githubusercontent.com/Mohamedhnini-a/testeur/refs/heads/main/working_configs.txt" \
            -o working_configs.txt

      - name: Update Gist
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          token = os.environ["GIST_TOKEN"]

          with open("working_configs.txt", "r", encoding="utf-8") as f:
              content = f.read()

          data = json.dumps({
              "files": {
                  "working_configs.txt": {
                      "content": content
                  }
              }
          }).encode("utf-8")

          request = urllib.request.Request(
              "https://api.github.com/gists/4150f35af6dbfb31985573a26d7c9c8e",
              data=data,
              method="PATCH"
          )

          request.add_header("Authorization", f"Bearer {token}")
          request.add_header("Accept", "application/vnd.github+json")
          request.add_header("X-GitHub-Api-Version", "2022-11-28")
          request.add_header("Content-Type", "application/json")

          with urllib.request.urlopen(request) as response:
              print("Gist updated successfully:", response.status)
          PY
