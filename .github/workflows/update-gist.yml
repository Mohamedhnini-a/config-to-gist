name: Update Gist

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

jobs:
  update-gist:
    runs-on: ubuntu-latest

    steps:
      - name: Get content from Worker
        run: |
          curl -fsSL \
            "https://orange-mountain-1d16.hninisiimoo.workers.dev/" \
            -o new_servers.txt

          # Prevent empty Worker responses
          if [ ! -s new_servers.txt ]; then
            echo "ERROR: Worker returned an empty file."
            exit 1
          fi

      - name: Compare and Update Gist
        env:
          GH_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request
          from datetime import datetime, timedelta, timezone

          GIST_ID = "4150f35af6dbfb31985573a26d7c9c8e"
          FILE_NAME = "servers.txt"
          TOKEN = os.environ["GH_TOKEN"]

          API_URL = f"https://api.github.com/gists/{GIST_ID}"

          # ==========================================
          # 1. Get current Gist
          # ==========================================

          request = urllib.request.Request(
              API_URL,
              headers={
                  "Authorization": f"Bearer {TOKEN}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )

          with urllib.request.urlopen(request) as response:
              gist_data = json.loads(
                  response.read().decode("utf-8")
              )

          files = gist_data.get("files", {})

          if FILE_NAME not in files:
              raise Exception(
                  f"{FILE_NAME} was not found in the Gist"
              )

          gist_file = files[FILE_NAME]

          # ==========================================
          # 2. Get complete old content
          # ==========================================

          if gist_file.get("truncated", False):
              raw_url = gist_file["raw_url"]

              raw_request = urllib.request.Request(
                  raw_url,
                  headers={
                      "Authorization": f"Bearer {TOKEN}",
                  },
              )

              with urllib.request.urlopen(raw_request) as response:
                  old_content = response.read().decode("utf-8")
          else:
              old_content = gist_file.get("content", "")

          # ==========================================
          # 3. Get Worker content EXACTLY as returned
          # ==========================================

          with open("new_servers.txt", "r", encoding="utf-8") as f:
              new_content = f.read()

          # Protect against empty or whitespace-only responses
          if not new_content.strip():
              raise Exception("Worker returned empty content. Gist NOT updated.")

          # Normalize line endings ONLY
          old_normalized = (
              old_content
              .replace("\r\n", "\n")
              .replace("\r", "\n")
          )

          new_normalized = (
              new_content
              .replace("\r\n", "\n")
              .replace("\r", "\n")
          )

          # ==========================================
          # 4. Remove only Last Update config for comparison
          # ==========================================

          UPDATE_PREFIX = "trojan://humanity@Sii.Moo:443"

          def remove_update_config(content):
              lines = content.splitlines()

              result = []

              for line in lines:
                  stripped = line.strip()

                  if (
                      stripped.startswith(UPDATE_PREFIX)
                      and "#Last%20Update%20" in stripped
                  ):
                      continue

                  result.append(line)

              return "\n".join(result).strip()

          old_for_compare = remove_update_config(old_normalized)
          new_for_compare = new_normalized.strip()

          # ==========================================
          # 5. Compare
          # ==========================================

          if old_for_compare == new_for_compare:
              changed = False

              print("================================")
              print("NO CHANGE")
              print("Worker content is unchanged.")
              print("Keeping existing Gist completely.")
              print("================================")

          else:
              changed = True

              print("================================")
              print("CHANGE DETECTED")
              print("Worker content has changed.")
              print("================================")

          # ==========================================
          # 6. Build final content
          # ==========================================

          if changed:

              # Morocco time UTC+1
              morocco_tz = timezone(timedelta(hours=1))

              now = datetime.now(morocco_tz)

              date_part = now.strftime("%d/%m/%Y")
              time_part = now.strftime("%H:%M")

              timestamp = (
                  date_part.replace("/", "%2F")
                  + "%20at%20"
                  + time_part.replace(":", "%3A")
              )

              update_config = (
                  "trojan://humanity@Sii.Moo:443"
                  "?security=tls"
                  "&sni=sii.moo"
                  "&insecure=0"
                  "&allowInsecure=0"
                  "&type=ws"
                  "&host=sii.moo"
                  "&path=%2F"
                  f"#Last%20Update%20{timestamp}"
              )

              # Worker content is preserved without filtering,
              # renaming, sorting, or removing duplicates.

              final_content = (
                  update_config + "\n" + new_content
              )

          else:
              final_content = old_content

          # ==========================================
          # 7. Update Gist
          # ==========================================

          if changed:

              payload = {
                  "files": {
                      FILE_NAME: {
                          "content": final_content
                      }
                  }
              }

              update_request = urllib.request.Request(
                  API_URL,
                  data=json.dumps(payload).encode("utf-8"),
                  method="PATCH",
                  headers={
                      "Authorization": f"Bearer {TOKEN}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "Content-Type": "application/json",
                  },
              )

              with urllib.request.urlopen(update_request) as response:
                  print("")
                  print("================================")
                  print("GIST UPDATED SUCCESSFULLY")
                  print("HTTP status:", response.status)
                  print("================================")

          else:
              print("Gist update skipped. No changes detected.")

          PY
