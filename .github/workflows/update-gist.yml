name: Update Gist

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

jobs:
  update-gist:
    runs-on: ubuntu-latest

    steps:
      - name: Get content from GitHub sources
        run: |
          set -e

          SOURCES=(
            "https://github.com/Mohamedhnini-a/testeur-2/raw/refs/heads/main/working_configs.txt"
            "https://github.com/Mohamedhnini-a/testeur/raw/refs/heads/main/working_configs.txt"
            "https://github.com/williamnecoo1-pixel/reality-2/raw/refs/heads/main/working_configs.txt"
            "https://github.com/williamnecoo1-pixel/reality/raw/refs/heads/main/working_configs.txt"
          )

          > new_servers.txt

          for URL in "${SOURCES[@]}"; do
            echo "Fetching: $URL"

            TEMP_FILE=$(mktemp)

            if curl -fsSL --retry 3 --retry-delay 2 \
              "$URL" -o "$TEMP_FILE"; then

              if [ -s "$TEMP_FILE" ]; then
                cat "$TEMP_FILE" >> new_servers.txt
                printf '\n' >> new_servers.txt
                echo "SUCCESS: $URL"
              else
                echo "ERROR: Empty source: $URL"
                exit 1
              fi

            else
              echo "ERROR: Failed source: $URL"
              exit 1
            fi

            rm -f "$TEMP_FILE"
          done

          if [ ! -s new_servers.txt ]; then
            echo "ERROR: No content collected."
            exit 1
          fi

          echo "================================"
          echo "ALL SOURCES DOWNLOADED"
          echo "Total lines: $(wc -l < new_servers.txt)"
          echo "================================"

      - name: Compare and Update Gist
        env:
          GH_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request
          from datetime import datetime, timedelta, timezone

          GIST_ID = "4150f35af6dbfb31985573a26d7c9c8e"
          FILE_NAME = "servers.txt"
          TOKEN = os.environ["GH_TOKEN"]

          API_URL = f"https://api.github.com/gists/{GIST_ID}"

          # ==========================================
          # 1. Get current Gist
          # ==========================================

          request = urllib.request.Request(
              API_URL,
              headers={
                  "Authorization": f"Bearer {TOKEN}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )

          with urllib.request.urlopen(request) as response:
              gist_data = json.loads(
                  response.read().decode("utf-8")
              )

          files = gist_data.get("files", {})

          if FILE_NAME not in files:
              raise Exception(
                  f"{FILE_NAME} was not found in the Gist"
              )

          gist_file = files[FILE_NAME]

          # ==========================================
          # 2. Get old content
          # ==========================================

          if gist_file.get("truncated", False):

              raw_url = gist_file["raw_url"]

              raw_request = urllib.request.Request(
                  raw_url,
                  headers={
                      "Authorization": f"Bearer {TOKEN}",
                  },
              )

              with urllib.request.urlopen(raw_request) as response:
                  old_content = response.read().decode("utf-8")

          else:
              old_content = gist_file.get("content", "")

          # ==========================================
          # 3. Read all collected sources
          # ==========================================

          with open(
              "new_servers.txt",
              "r",
              encoding="utf-8"
          ) as f:
              new_content = f.read()

          if not new_content.strip():
              raise Exception(
                  "Collected content is empty. Gist NOT updated."
              )

          # Normalize line endings only
          old_normalized = (
              old_content
              .replace("\r\n", "\n")
              .replace("\r", "\n")
          )

          new_normalized = (
              new_content
              .replace("\r\n", "\n")
              .replace("\r", "\n")
          )

          # ==========================================
          # 4. Remove ONLY Last Update for comparison
          # ==========================================

          UPDATE_PREFIX = (
              "trojan://humanity@Sii.Moo:443"
          )

          def remove_update_config(content):

              lines = content.splitlines()
              result = []

              for line in lines:

                  stripped = line.strip()

                  if (
                      stripped.startswith(UPDATE_PREFIX)
                      and "#Last%20Update%20" in stripped
                  ):
                      continue

                  result.append(line)

              return "\n".join(result).strip()

          old_for_compare = remove_update_config(
              old_normalized
          )

          new_for_compare = new_normalized.strip()

          # ==========================================
          # 5. Compare
          # ==========================================

          if old_for_compare == new_for_compare:

              changed = False

              print("================================")
              print("NO CHANGE")
              print("All sources are unchanged.")
              print("Keeping existing Gist.")
              print("================================")

          else:

              changed = True

              print("================================")
              print("CHANGE DETECTED")
              print("Updating Gist.")
              print("================================")

          # ==========================================
          # 6. Create final content
          # ==========================================

          if changed:

              morocco_tz = timezone(
                  timedelta(hours=1)
              )

              now = datetime.now(morocco_tz)

              date_part = now.strftime(
                  "%d/%m/%Y"
              )

              time_part = now.strftime(
                  "%H:%M"
              )

              timestamp = (
                  date_part.replace("/", "%2F")
                  + "%20at%20"
                  + time_part.replace(":", "%3A")
              )

              update_config = (
                  "trojan://humanity@Sii.Moo:443"
                  "?security=tls"
                  "&sni=sii.moo"
                  "&insecure=0"
                  "&allowInsecure=0"
                  "&type=ws"
                  "&host=sii.moo"
                  "&path=%2F"
                  f"#Last%20Update%20{timestamp}"
              )

              # Last Update goes FIRST
              # All source contents remain unchanged

              final_content = (
                  update_config
                  + "\n"
                  + new_content
              )

          else:

              final_content = old_content

          # ==========================================
          # 7. Update Gist only if changed
          # ==========================================

          if changed:

              payload = {
                  "files": {
                      FILE_NAME: {
                          "content": final_content
                      }
                  }
              }

              update_request = urllib.request.Request(
                  API_URL,
                  data=json.dumps(
                      payload
                  ).encode("utf-8"),
                  method="PATCH",
                  headers={
                      "Authorization": f"Bearer {TOKEN}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "Content-Type": "application/json",
                  },
              )

              with urllib.request.urlopen(
                  update_request
              ) as response:

                  print("")
                  print("================================")
                  print("GIST UPDATED SUCCESSFULLY")
                  print("HTTP status:", response.status)
                  print("================================")

          else:
              print("Gist update skipped. No changes detected.")

          PY
