name: Test Gist Token

on:
  workflow_dispatch:

jobs:
  test-token:
    runs-on: ubuntu-latest

    steps:
      - name: Test GIST_TOKEN
        env:
          GH_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          echo "Testing GIST_TOKEN..."

          HTTP_CODE=$(curl -sS \
            -o response.json \
            -w "%{http_code}" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/gists/4150f35af6dbfb31985573a26d7c9c8e")

          echo "HTTP status: $HTTP_CODE"

          cat response.json

          if [ "$HTTP_CODE" = "200" ]; then
            echo "✅ GIST_TOKEN صالح والـGist قابل للقراءة."
          elif [ "$HTTP_CODE" = "401" ]; then
            echo "❌ GIST_TOKEN غير صالح / منتهي / Bad credentials."
            exit 1
          elif [ "$HTTP_CODE" = "403" ]; then
            echo "⚠️ GIST_TOKEN معروف ولكن ما عندوش الصلاحية المطلوبة."
            exit 1
          elif [ "$HTTP_CODE" = "404" ]; then
            echo "⚠️ الـToken خدام، ولكن الـGist غير موجود أو غير قابل للوصول."
            exit 1
          else
            echo "❌ Unexpected HTTP status."
            exit 1
          fi
